services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume-fit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: resume_fit
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: resume-fit-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://rag:rag@postgres:5432/resume_fit
      VAGAS_DIR: /app/data/vagas-exemplo
    volumes:
      - ./data/vagas-exemplo:/app/data/vagas-exemplo:ro
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n:latest
    container_name: resume-fit-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Araguaina
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8n_data:
